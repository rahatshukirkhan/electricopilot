[project]
name = "electricopilot"
version = "0.1.0"
description = "Auditable AI copilot for electrical design: IEC 60364 cable & protective-device sizing with traceable-to-norm justifications."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ElectriCopilot" }]
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.110",
    "ezdxf>=1.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
db = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
]
api = [
    "uvicorn>=0.29",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.scripts]
electricopilot = "electricopilot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/electricopilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# api.py depends on the optional `api` extra (fastapi); its decorators are untyped when
# fastapi isn't installed. Scope that one check off so `mypy src` stays green by default.
[[tool.mypy.overrides]]
module = "electricopilot.api"
disallow_untyped_decorators = false
